<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-project R04H Art</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="app-container">
        <nav id="nav" class="nav-container">
            <section class="nav-container-main">
                <section class="nav-left">
                    <span class="logo-web-r04hart">R04H Art</span>
                </section>
                <section class="nav-right">
                    <div class="list-menu-nav-right">
                        <a href="#gallery" class="menu-nav-right">Gallery</a>
                        <a href="#negative-art" class="menu-nav-right">Negative Art</a>
                        <a href="#process" class="menu-nav-right">Process</a>
                        <a href="#about" class="menu-nav-right">About</a>
                        <a href="#contact" class="menu-nav-right">Contact</a>
                    </div>
                    <i class="bi bi-search icon-search"></i>
                </section>
            </section>
        </nav>
        <main class="main-container">
            <section class="main-content hero-art">
                <div class="hero-art-container">
                    <h1>Hero Art</h1>
                    <div class="hero-box">
                        <img src="#" alt="R04H Art img" class="img-r04hart-karya">
                        <a href="#" class="r04h-art-link">
                            <span class="nama-karya">Karya 1</span>
                            <span class="tgl-karya">23 Nov 2026</span>
                        </a>
                    </div>
                </div>
            </section>
            <section id="gallery" class="main-content gallry-container">
                <h1>Galleri Art</h1>
            </section>
            <section id="negative-art" class="main-content negative-art-container">
                <h1>Negative Art</h1>
            </section>
            <section id="process" class="main-content process-container">
                <h1>Process Art</h1>
            </section>
            <section id="about" class="main-content about">
                <h1>About me</h1>
            </section>
            <section id="contact" class="main-content contact-container">
                <h1>Contact</h1>
            </section>
        </main>
    </div>
    <a href="#nav" class="btn-roll-back">
        <i class="bi bi-chevron-double-up"></i>
    </a>
</body>
</html>
